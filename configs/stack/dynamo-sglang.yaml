# InferenceX gb300 dynamo-sglang AgentX recipes (disagg-*-mtp-kvoffload, spec draft_model): values not public; defaults
# follow the TRT recipe shape. t_step_fixed_ms and mtp_accept_dist are calibration parameters.
framework: sglang
mtp_nextn: 3
mtp_accept_dist: [0.10, 0.20, 0.30, 0.40]
chunked_prefill: true
chunk_tokens: 16384
mix_prefill_decode: false
max_num_batched_tokens: 16384
max_num_seqs: 64
prefix_cache: true
prefix_policy: per_conversation
kv_offload: true
kv_delivery: full
graph_replay: true
t_step_fixed_ms: 0.0
wide_ep: true
