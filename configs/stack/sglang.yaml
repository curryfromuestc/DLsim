# InferenceX b200 / b300 sglang AgentX recipes (aggregated, single node): values not public; defaults follow the dynamo-sglang
# stack with prefill and decode mixed in one pool. t_step_fixed_ms and mtp_accept_dist are calibration parameters.
framework: sglang
mtp_nextn: 3
mtp_accept_dist: [0.10, 0.20, 0.30, 0.40]
chunked_prefill: true
chunk_tokens: 16384
mix_prefill_decode: true
max_num_batched_tokens: 16384
max_num_seqs: 64
prefix_cache: true
prefix_policy: per_conversation
kv_offload: true
kv_delivery: full
graph_replay: true
t_step_fixed_ms: 0.0
wide_ep: true
