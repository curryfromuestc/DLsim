# Optimum: minimise cost per million tokens subject to an interactivity floor, over compute, bandwidth and decode workers,
# with a die-edge style coupling between memory bandwidth and scale-up bandwidth.
point: configs/points/gb300_dynamo-trt_440975.yaml
kind: optimum
variables:
  - {name: device.flops.fp4, lo: 5.0e15, hi: 50.0e15, log_scale: true}
  - {name: device.memory.0.bandwidth_Bps, lo: 4.0e12, hi: 20.0e12, log_scale: true}
  - {name: mapping.decode.workers, choices: [1, 2]}
targets:
  - {metric: p90_e2e_norm_intvty, min: 40}
objectives:
  - {metric: cost_per_mtoken, minimize: true}
constraints:
  - {name: die_edge, weights: {device.memory.0.bandwidth_Bps: 1.0e-12, fabric.scaleup.bandwidth_Bps: 2.0e-12}, bound: 22.0}
cost: {depreciation_s: 157788000, electricity_usd_per_kwh: 0.1, pue: 1.3}
grid_per_axis: 4
screen: false
